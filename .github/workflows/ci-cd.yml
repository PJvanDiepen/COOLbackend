name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - production

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on production
        run: |
          git fetch origin production:refs/remotes/origin/production
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/production

      - name: Configure SSH
        env:
          COOL_DEPLOY_SSH_KEY: ${{ secrets.COOL_DEPLOY_SSH_KEY }}
        run: |
          test -n "$COOL_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$COOL_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan 0-0-0.nl >> ~/.ssh/known_hosts

      - name: Deploy tag to production
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        run: ./bin/deploy_prod
