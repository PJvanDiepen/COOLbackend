<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mini tixy</title>
    <style>
        body { margin: 0; background:#111; display:flex; height:100vh; align-items:center; justify-content:center; }
        canvas { background:#111; }
    </style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    const COLS = 16;
    const ROWS = 16;
    const DOT_SIZE = canvas.width / COLS;

    // Change this expression to play:
    // t = time (seconds), i = index, x,y = grid coords
    let expr = "Math.sin(t*2 + x) * Math.cos(t*2 + y)";

    /*
    Martin Kleppe zie https://tixy.land/
     */
    expr = "Math.sin(y/8+t)";

    // Build a function from the expression
    let f = new Function("t", "i", "x", "y", "return " + expr);

    function draw(timeMs) {
        const t = timeMs / 1000; // seconds
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let i = 0;
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++, i++) {
                let v = f(t, i, x, y);      // evaluate expression
                let mag = Math.max(0, Math.min(1, Math.abs(v))); // clamp 0..1

                // map sign to color
                ctx.fillStyle = v >= 0 ? "#fff" : "#000";

                // center of dot
                const cx = (x + 0.5) * DOT_SIZE;
                const cy = (y + 0.5) * DOT_SIZE;
                const r = (DOT_SIZE * 0.5) * mag;

                if (r > 0.01) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
</script>
</body>
</html>
